  lint-php-files:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.2", "8.3", "8.4"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed PHP files
        id: changed-php-files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            **/*.php

      - name: Set up PHP ${{ matrix.php-version }}
        if: steps.changed-php-files.outputs.any_changed == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      - name: Install Composer dependencies
        if: steps.changed-php-files.outputs.any_changed == 'true'
        uses: ramsey/composer-install@v2
        with:
          # Ignore zip for php-webdriver/webdriver
          composer-options: "--ignore-platform-reqs"

      - name: Update the composer.lock file
        if: steps.changed-php-files.outputs.any_changed == 'true'
        run: composer update

      - name: Validate composer.json and composer.lock
        if: steps.changed-php-files.outputs.any_changed == 'true'
        run: composer validate --strict

      # TODO: Enable this after resolving issues
      # - name: Cache coding-standard
      #   # Allow the previous check to fail but not abort
      #   if: always()
      #   uses: actions/cache@v4
      #   with:
      #     path: .phpcs-cache
      #     key: phpcs-cache

      - name: Lint PHP syntax
        if: steps.changed-php-files.outputs.any_changed == 'true'
        run: |
          echo "Checking PHP syntax for changed files..."
          for file in ${{ steps.changed-php-files.outputs.all_changed_files }}; do
            php -l "$file"
          done

      - name: PHP-CS-Fixer (dry-run for CI)
        if: steps.changed-php-files.outputs.any_changed == 'true'
        run: composer lint -- ${{ steps.changed-php-files.outputs.all_changed_files }}

      - name: PHP_CodeSniffer (phpcs)
        if: steps.changed-php-files.outputs.any_changed == 'true'
        run: composer cs -- ${{ steps.changed-php-files.outputs.all_changed_files }}

      # TODO: Enable this after resolving issues
      # - name: Check coding-standard
      #   # Allow the previous check to fail but not abort
      #   if: always()
      #   run: composer phpcs

  analyse-php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.4"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed PHP files
        id: changed-php-files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            **/*.php

      - name: Get changed config files
        id: changed-config-files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            phpstan.neon
            phpstan.neon.dist
            composer.json
            composer.lock

      - name: Set up PHP ${{ matrix.php-version }}
        if: steps.changed-php-files.outputs.any_changed == 'true' || steps.changed-config-files.outputs.any_changed == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
      #          extensions: mbstring, iconv, mysqli, zip, gd, bz2

      - name: Install Composer dependencies
        if: steps.changed-php-files.outputs.any_changed == 'true' || steps.changed-config-files.outputs.any_changed == 'true'
        uses: ramsey/composer-install@v2

      - name: Cache Composer dependencies
        if: steps.changed-php-files.outputs.any_changed == 'true' || steps.changed-config-files.outputs.any_changed == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-version }}-composer-

      - name: Analyse changed files with PHPStan
        if: steps.changed-php-files.outputs.any_changed == 'true' && steps.changed-config-files.outputs.any_changed != 'true'
        run: composer stan -- ${{ steps.changed-php-files.outputs.all_changed_files }}

      - name: Analyse all files with PHPStan (config changed)
        if: steps.changed-config-files.outputs.any_changed == 'true'
        run: composer stan

  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.2", "8.3", "8.4"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      - name: Install Composer dependencies
        # Allow the previous check to fail but not abort
        if: always()
        uses: ramsey/composer-install@v2
        with:
          # Ignore zip for php-webdriver/webdriver
          composer-options: "--ignore-platform-req=ext-zip"

      - name: Create main config.php for unit tests
        run: cp config/config.dist.php config/config.php

      - name: Create plugin config.php for unit tests
        run: |
          for source in $(find plugins -type f -name "*dist*"); do
            target=$(echo "${source}" | sed -e "s/.dist//")
            if ! [ -f "config/$(basename ${target})" ]; then
              cp --no-clobber "${source}" "config/$(basename ${target})"
              sudo chown www-data:www-data "config/$(basename ${target})"
            fi
            if ! [ -f ${target} ]; then
              ln -s "config/$(basename ${target})" "${target}"
            fi
          done

      - name: Run PHPUnit tests
        if: steps.changed-php-files.outputs.any_changed == 'true' || steps.changed-config-files.outputs.any_changed == 'true'
        run: composer phpunit
